version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: stock-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: stock_db
      MYSQL_USER: stock_user
      MYSQL_PASSWORD: stock_pass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 6

  backend:
    build:
      context: ./BACKEND
      dockerfile: Dockerfile
    container_name: stock-backend
    env_file:
      - ./BACKEND/.env.prod
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_HOST: db
      DB_DATABASE: stock_db
      DB_USERNAME: stock_user
      DB_PASSWORD: stock_pass
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stock-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
